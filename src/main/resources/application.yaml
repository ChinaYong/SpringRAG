# 服务器基础配置
server:
  port: 8080

# Spring 核心配置
spring:
  config:
    import: "optional:file:./secrets.properties"

  application:
    name: spring-rag

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}

  output:
    ansi:
      enabled: ALWAYS

  ai:
    vectorstore:
      qdrant:
        host: 8f6c49b8-202c-466c-b1a6-56c881420ed1.us-west-1-0.aws.cloud.qdrant.io
        port: 6334
        use-tls: true
        api-key: ${QDRANT_API_KEY}
        collection-name: spring-rag
        initialize-schema: true

    model:
      embedding: openai
      chat: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    # 使用 OpenAI 兼容协议连接 OpenRouter，凭据来自 OpenRouter。
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      embedding:
        embeddings-path: /v1/embeddings
        options:
          model: openai/text-embedding-3-small

# 文件存储
file:
  storage:
    base-path: ./storage/files # 文件存储基础路径
    max-file-size: 52428800 # 50MB
    allowed-file-types: pdf,txt,md,docx,jpg,png # 允许的文件类型
    temp-path: ./storage/temp # 临时文件存储路径
